current:
  label: "Work in progress · Thesis paper 1"
  title: "Big Benches: giant benches as territorial attractions in Italy and Europe"
  summary: "A georeferenced dataset of the giant benches built across Italy and Europe, with year of construction, cost, accessibility and nearby services, as the basis for studying where these installations spread and how much demand they attract."
