    focus: "50% 50%"
    credit: { en: "Museum of Ice Cream, San Francisco. Photo: [Thomas Hawk](https://www.flickr.com/photos/thomashawk/28095527999/), CC BY-NC 2.0", es: "Museum of Ice Cream, San Francisco. Foto: [Thomas Hawk](https://www.flickr.com/photos/thomashawk/28095527999/), CC BY-NC 2.0" }
    title:
      en: "Visual tourist attractions"
      es: "Atractivos turísticos visuales"
    status: { en: "Work in progress", es: "Trabajo en curso" }
    text:
      en: "Selfie parks, monumental sculptures and conspicuous consumption. How are they built, who visits them and what changes around them? Comparative case studies, ethnography, netnography and spatial data."
      es: "Parques selfie, esculturas monumentales y consumo conspicuo. ¿Cómo se construyen, quién los visita y qué cambia en el entorno? Estudios de caso comparados, etnografía, netnografía y datos espaciales."

