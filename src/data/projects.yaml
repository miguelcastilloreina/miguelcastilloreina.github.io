# Líneas de investigación. El `id` enlaza con el campo `line` de publications.yaml.
lines:
  - id: visual
    title: "Visual tourist attractions"
    period: "2025–"
    text: "My doctoral research. Selfie parks, giant benches and oversized sculptures in Colombian and European municipalities: how they are built, who visits them and what they change locally. Comparative case studies, ethnography, netnography and spatial data."

  - id: territorial
    title: "Territorial development"
    period: "2019–"
    text: "Latin American thinking on territory and development, with a focus on Sergio Boisier, and the economic situation of Boyacá."

  - id: social-capital
    title: "Social capital in rural communities"
    period: "2019–"
    text: "How trust and cooperation shape development in small Andean municipalities and producer organisations."

  - id: tourism
    title: "Tourism and innovation"
    period: "2018–"
    text: "Community-based tourism, value added and co-creation of experiences in rural Boyacá."

  - id: teaching
    title: "Economics education"
    period: "2018–"
    text: "How economics is taught in Latin America and what that teaching does to the profession and to policy."
