#
# image: opcional. Foto propia o mapa guardado en public/img/projects/ (por ejemplo "big-benches-mapa.jpg").
#        Si está vacío se muestra una miniatura generada con curvas de nivel.
# image_alt: descripción breve de la imagen (en/es), para lectores de pantalla.

current:
  label:
    en: "In progress. First thesis paper"
    es: "En curso. Primer artículo de la tesis"
  title:
    en: "Built to Be Photographed: Conspicuous Consumption and the Co-Creation of Instagrammable Tourist Attractions"
    es: "Built to Be Photographed: Conspicuous Consumption and the Co-Creation of Instagrammable Tourist Attractions"
  summary:
    en: "Tourism is more than a service co-created at the moment of delivery: it is an experience that is planned, lived and remembered. This paper studies a new category of attraction whose value lies not in historical significance or cultural depth, but in its use as a photogenic backdrop for self-presentation. Purpose-built, visually oriented attractions have multiplied across the Global South, designed to be photographed and shared rather than experienced in the conventional sense. The paper reads them through conspicuous consumption and the way visitors and destinations co-create their value."
    es: "El turismo es más que un servicio cocreado en el momento de su prestación: es una experiencia que se planea, se vive y se recuerda. Este artículo estudia una nueva categoría de atractivo cuyo valor no reside en su importancia histórica ni en su densidad cultural, sino en su capacidad de servir como telón de fondo fotogénico para la autopresentación. Los atractivos construidos a propósito y orientados a lo visual se han multiplicado en el Sur Global, diseñados para ser fotografiados y compartidos más que para ser vividos en el sentido convencional. El artículo los analiza desde el consumo conspicuo y la forma en que visitantes y destinos cocrean su valor."
  image: ""
  image_alt: { en: "", es: "" }
  # Archivos descargables del trabajo (en public/activity/slides/, los mismos de la galería de Actividad).
  files:
    - file: "castillo-reina-acei-2026-built-to-be-photographed.pdf"
      label: { en: "Slides (PDF)", es: "Presentación (PDF)" }
      note: { en: "ACEI Summer School on Cultural Economics · Mantua, Italy · 6–10 July 2026", es: "ACEI Summer School on Cultural Economics · Mantua, Italia · 6–10 de julio de 2026" }

