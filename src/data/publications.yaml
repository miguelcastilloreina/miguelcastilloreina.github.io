- type: chapter
  year: 2019
  title: "La enseñanza de la economía: política, ideología y mercado"
  authors: ["Corredor, F.", "Castillo-Reina, M."]
  outlet: "U. Externado"
  image: "https://simehbucket.s3.amazonaws.com/images/3012e4fbe03f911b804ed3e00d1cfaa5-large.jpg"
  venue:
    en: "In J. I. González & M. Pérez (Eds.), *Mercados y bienestar: ensayos en memoria de Homero Cuevas* (pp. 81–118). Universidad Externado de Colombia"
    es: "En J. I. González y M. Pérez (Eds.), *Mercados y bienestar: ensayos en memoria de Homero Cuevas* (pp. 81–118). Universidad Externado de Colombia"
  url: "https://bdigital.uexternado.edu.co/handle/001/2873"
  url_label: { en: "Repository", es: "Repositorio" }
  abstract:
    en: >-
      This chapter proposes that the mainstream teaching in economics is determined mainly by political, ideological and market criteria. This fact implies that the teaching economics could contradict its fundamental purpose, which is essentially altruistic: the search for the common good. Using seminal discussions proposed by the Colombian emeritus professor Homero Cuevas as a starting point, this essay explores the concept pluralist teaching, that can contribute to align what is taught today and what should be taught in order to accomplish economics’ goals. It is argued that pluralist teaching can take place different educational alternatives manage their resources strategically, in terms market positioning and political power networking.
    es: >-
      Este capítulo plantea que la enseñanza predominante en economía está determinada fundamentalmente por criterios políticos, ideológicos y de mercado, razón por la cual puede entrar en contradicción con el propósito último de la disciplina, que es uno esencialmente altruista: el bien común. A partir de discusiones seminales propuestas por el profesor Homero Cuevas, se explora la noción de una enseñanza plural, que puede contribuir a alinear lo que se enseña con lo que se necesita para que la economía cumpla con el objetivo que se propone. Se argumenta que una enseñanza plural puede establecerse en la medida en que distintas alternativas educativas administren sus recursos de forma estratégica, es decir, aumenten su poder y se posicionen en el mercado.
  line: teaching

- type: working
  year: 2021
  title: "Puentes y escaleras como caminos: el «desarrollo» y el capital social en el municipio de Gachantivá, Boyacá, 2020"
  authors: ["Castillo-Reina, M."]
  outlet: "UPTC"
  venue:
    en: "Master's thesis, Universidad Pedagógica y Tecnológica de Colombia (with distinction)"
    es: "Tesis de maestría, Universidad Pedagógica y Tecnológica de Colombia (meritoria)"
  url: "https://repositorio.uptc.edu.co//handle/001/9660"
  url_label: { en: "Repository", es: "Repositorio" }
  abstract:
    es: >-
      Caminar por la senda del desarrollo requiere simultáneamente de una base material y una subjetiva que permita a los territorios, como contenedores y contenido, hacer frente al doble proceso de apertura (descentralización y globalización). Por su naturaleza excluyente, el mercado tiende a concentrar los recursos exógenos de inversión que pudieran ser útiles para el crecimiento económico en grandes ciudades, condenando al ostracismo y la exclusión a los territorios más frágiles y pequeños. El capital social, entendido como un activo de recursos reales y potenciales asociados al individuo, puede influir en el desarrollo territorial al facilitar la cooperación, reducir los costos de transacción, simplificar el acceso a la información e incluso generar formas alternativas de intercambio. Esta investigación explora la relación entre el capital social y el desarrollo a partir de métodos mixtos en el municipio de Gachantivá en el departamento de Boyacá. Los resultados obtenidos mediante encuestas y entrevistas muestran que a pesar de una baja participación en espacios asociativos o juntas de acción comunal (75% de la muestra), las personas estarían muy dispuestas a trabajar en proyectos que beneficien a la comunidad y aunque no consideren los habitantes de su vereda tan honestos, confían en ellos y su disposición solidaria a ayudar. El capital social latente en el municipio requiere de liderazgos y fortalecimiento, de buscar las mejores formas de atraer capital e inversión para transformar ventajas comparativas estáticas en competitivas dinámicas.
  line: social-capital

- type: working
  year: 2020
  title: "Efectos y expectativas de recuperación económica frente a la pandemia COVID-19 en el departamento de Boyacá"
  authors: ["Ochoa, C.", "Suárez, L.", "Suárez, H.", "Ramírez, E.", "Valderrama, A.", "Castillo-Reina, M.", "Castro, H.", "Matallana, O."]
  outlet: "SSRN"
  image: "https://cctunja.org.co/boyacacompite/wp-content/uploads/2020/07/estudio.png"
  venue:
    en: "SSRN working paper"
    es: "Documento de trabajo, SSRN"
  doi: "10.2139/ssrn.3664379"
  abstract:
    en: >-
      The effects of COVID-19 have reached unsuspected limits on public health and the economy. Job destruction and business closures have led to a loss of acquired skills in companies (as organizations) and their employees. This document presents the results of a survey applied during May and June 2020 to more than 1,000 companies throughout the department of Boyacá (Colombia) in aspects related to their income, their cost structure and their recovery expectations, a description of the economic policies assumed in Latin America related to the crisis as well as an additional section of local policies. The results obtained show the fragility and differential effect of companies in the face of the double shock, of supply and demand, generated by COVID-19. In our sample, a third of the 45 percent of the companies that registered a decrease in their sales have had falls of more than 70 percent. The availability of cash has restricted the payment of rent, utilities and bank loans. Respondents suggested that local governments should design packages of subsidies, tax reductions and timely information for the implementation of biosecurity protocols. Despite business formality, labor informality limits employers' access to payroll subsidy programs. Information and conditions for access to this and other programs end up being deficient.
    es: >-
      Los efectos del COVID-19 han alcanzado límites insospechados en la salud pública y la economía. La destrucción de empleos y cierres comerciales ha generado una pérdida de capacidades adquiridas en las empresas (como organizaciones) y sus empleados. Este documento presenta el resultado de una encuesta aplicada durante mayo y junio de 2020 a más de 1.000 empresas en todo el departamento de Boyacá (Colombia) en aspectos relacionados con sus ingresos, su estructura de costos y sus expectativas de recuperación, una descripción de las políticas económicas asumidas en América Latina frente a la crisis así como un aparte adicional de políticas locales. Los resultados obtenidos muestran la fragilidad y efecto diferencial de las empresas ante el doble choque, de oferta y demanda, generado por la pandemia. En nuestra muestra, un tercio del 45 por ciento de las empresas que registró una disminución en sus ventas, ha tenido caídas de más del 70 por ciento. La disponibilidad de efectivo ha restringido el pago oportuno de arrendamientos, servicios públicos y créditos bancarios. Los encuestados sugirieron que los gobiernos locales deberían diseñar paquetes de subsidios, reducción de impuestos e información oportuna para la implementación de protocolos de bioseguridad. A pesar de la formalidad empresarial, la informalidad laboral limita el acceso por parte de los empresarios a programas de subsidio a la nómina. La información y condiciones para el acceso a este y otros programas termina siendo deficiente.
  line: territorial

