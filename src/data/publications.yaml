# Publicaciones. Cada entrada empieza con un guion.
#
# type:     article | working | chapter | book | policy
# outlet:   nombre corto que aparece en la miniatura (revista, editorial…)
# image:    opcional. Portada: nombre de un archivo en public/img/pubs/ (por ejemplo "acta-agronomica.jpg")
#           o una dirección https:// completa.
#           Si está vacío se genera una miniatura con el nombre de la revista.
# status:   etiqueta opcional ("Submitted", "R&R", "Forthcoming"…), con versión en/es
# selected: true -> aparece en la portada
# line:     línea de investigación a la que pertenece (ver projects.yaml)
#
# Los títulos van en su idioma original. `venue` puede ser un texto único o tener versión en/es.
# abstract: resumen desplegable (en/es). Si solo hay un idioma, se muestra ese en ambas versiones.
# Formato: *cursiva*. Tu nombre se resalta solo.

- type: article
  year: 2023
  title: "Yellow pitahaya (*Selenicereus megalanthus*) in Miraflores, Boyacá, Colombia: a social capital approach in a producer organisation"
  authors: ["Castillo-Reina, M.", "Pérez, N.", "Ruiz, I."]
  outlet: "Acta Agronómica"
  image: "https://revistas.unal.edu.co/public/journals/10/cover_issue_6027_es_ES.jpg"
  venue: "*Acta Agronómica*, 71(4)"
  doi: "10.15446/acag.v71n4.100152"
  selected: true
  abstract:
    en: >-
      Yellow pitahaya (Selenicereus megalanthus) has become an alternative for agricultural production in several municipalities of the province of Lengupá, in the department of Boyacá, Colombia, with an expanding and consolidating international market due to its status as an exotic fruit. This paper presents the results of a mixed methods research conducted with producers affiliated with the PITAFCOL organization in the municipality of Miraflores. The characteristics of the fruit and its market were described, and the socioeconomic conditions of the members of the association, as well as their attitudes of trust, reciprocity, and solidarity under the perspective of social capital (bonding type) were characterized. The conclusions point to the need to strengthen the trust within the organization for its consolidation, improve the organizational practices and seek new allies for processing the fruit to generate added value to the product, as well as alternative economic activities.
    es: >-
      Con un mercado internacional en expansión y consolidación, dada su condición de fruta exótica, la pitahaya amarilla (Selenicereus megalanthus) se ha constituido como una alternativa de producción agrícola en varios municipios de la provincia de Lengupá, en el departamento de Boyacá en Colombia. Este artículo presenta los resultados de una investigación adelantada mediante métodos mixtos con productores asociados a la organización PITAFCOL en el municipio de Miraflores. Su objetivo es describir las características de la fruta, su mercado, las condiciones socioeconómicas de los integrantes de la asociación, así como conocer sus actitudes de confianza, reciprocidad y solidaridad bajo la perspectiva del capital social (de tipo bonding). Las conclusiones apuntan a la necesidad de fortalecer la confianza al interior de la organización para su consolidación, la mejora de prácticas organizacionales y la necesidad de buscar nuevos aliados para la transformación que generen valor agregado al producto, así como actividades económicas alternativas.
  line: social-capital

- type: article
  year: 2021
  title: "Tourist sector innovation: an approach to the services and the co-creation of experiences"
  authors: ["Castillo-Reina, M.", "Cruz-Vásquez, J."]
  outlet: "Turismo y Sociedad"
  image: "https://revistas.uexternado.edu.co/public/journals/8/cover_issue_754_es_ES.jpg"
  venue: "*Turismo y Sociedad*, 30, 25–49"
  doi: "10.18601/01207555.n30.02"
  selected: true
  abstract:
    es: >-
      En los últimos años el término innovación se ha usado ampliamente para describir la generación de nuevos procesos o productos en la economía, principalmente en aquellos sectores intensivos en capital y mano de obra (manufactureros). Ante la importancia del turismo en la economía mundial, se considera conveniente revisar cómo la innovación afecta su competitividad. En la introducción se presentan algunos temas de interés en la actualidad para el sector. La segunda sección presenta algunos aspectos característicos y distintivos de la economía de los servicios. En la tercera se presentan aproximaciones a la innovación en los servicios y el turismo para finalizar con la presentación de la economía experiencial y la cocreación como potencial herramienta para la innovación. Finalmente, se presentan unas conclusiones parciales. Se argumenta que la innovación en el turismo tiene que entenderse como derivada de la cocreación, que el sector no es simplemente un imitador y que requiere un marco de análisis propio.
  line: tourism

- type: book
  year: 2021
  title: "Alternativas y potencialidades de valor agregado en iniciativas turísticas de tipo comunitario: lecciones a partir del caso de la subprovincia del Alto Ricaurte (Boyacá)"
  authors: ["Dueñas, D.", "Vianchá, Z.", "Fraile, A.", "Castillo-Reina, M.", "et al."]
  outlet: "Editorial UPTC"
  image: "https://librosaccesoabierto.uptc.edu.co/public/presses/1/submission_155_138_coverImage_es_ES_t.png"
  venue: "Editorial UPTC"
  doi: "10.19053/9789586605380"
  abstract:
    es: >-
      A pesar de los efectos negativos generados por la pandemia de COVID-19, el turismo de base comunitaria se constituye como una forma alternativa de crecimiento económico y desarrollo gracias a la integración de experiencias locales, así como del aprovechamiento y conservación de los recursos naturales, culturales y patrimoniales. Esta investigación se concentró en identificar los factores que agregan valor y cómo se involucran los actores que participan en esta clase de turismo. Se presenta un contexto teórico y estado del arte en las categorías de territorialidad, turismo comunitario, cadena y flujo de valor y procesos de co-creación de valor. Los resultados parten de la caracterización socioeconómica de la Subprovincia del Alto Ricaurte en Boyacá, el análisis de la oferta y la percepción de turista en los procesos de co-creación sobre la agregación de valor, lo que confirma la importancia del turismo comunitario como proceso de construcción colectiva que involucra diversos enfoques y conceptos frente a cómo se interpreta y cómo se maneja.
  line: tourism

