#   photos: ["2026-05-taller-1.jpg", "2026-05-taller-2.jpg"]   # en public/img/activity/
#   slides: "2026-05-taller.pdf"          # opcional, en public/activity/slides/
#   url: "https://…"                      # opcional, página del evento

