# Frase principal de la portada. Lo que va entre ** se resalta en color.
tagline: "I study how **purpose-built visual attractions** (selfie parks, giant benches, oversized sculptures) reshape tourism and development in small towns."

bio:
  - "I am a Colombian economist and a PhD candidate in Regional Science and Economic Geography at the Gran Sasso Science Institute in L'Aquila, supervised by Maria Giovanna Brandano and Alessandra Faggian."
  - "My thesis looks at attractions built to be photographed and asks what they do to visitor flows, local economies and the image of the places that build them. I combine comparative case studies, fieldwork and online data with spatial analysis."
  - "I also write on territorial development theory, especially the work of Sergio Boisier, on social capital, and on how economics is taught in Latin America."

