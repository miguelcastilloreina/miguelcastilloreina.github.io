# Frase principal de la portada.
tagline:
  en: "I study how **purpose-built visual attractions** (selfie parks, giant benches, oversized sculptures) reshape tourism and development in small towns."
  es: "Estudio cómo los **atractivos visuales construidos a propósito** (parques selfie, bancas gigantes, esculturas monumentales) transforman el turismo y el desarrollo de los municipios pequeños."

# Presentación de la portada: un párrafo por guion.
bio:
  en:
    - "I am a Colombian economist and a PhD candidate in Regional Science and Economic Geography at the Gran Sasso Science Institute (GSSI) in L'Aquila, Italy, supervised by [Maria Giovanna Brandano](https://www.gssi.it/people/professors/lectures-social-science-gssi-cities/item/5387-brandano-maria-giovanna) and [Alessandra Faggian](https://www.gssi.it/people/professors/lectures-social-science-gssi-cities/item/2234-faggian-alessandra)."
    - "My doctoral research sits between cultural economics and tourism economics. More broadly, I am interested in debates on territorial development, public policy and the history of economic thought."
  es:
    - "Soy economista colombiano y doctorando en Ciencia Regional y Geografía Económica en el Gran Sasso Science Institute (GSSI), en L'Aquila (Italia), bajo la dirección de [Maria Giovanna Brandano](https://www.gssi.it/people/professors/lectures-social-science-gssi-cities/item/5387-brandano-maria-giovanna) y [Alessandra Faggian](https://www.gssi.it/people/professors/lectures-social-science-gssi-cities/item/2234-faggian-alessandra)."
    - "Mi investigación doctoral se sitúa entre la economía de la cultura y la economía del turismo. De forma más amplia, me interesan las discusiones sobre desarrollo territorial, políticas públicas e historia del pensamiento económico."

interests:
  en: ["Cultural economics", "Tourism economics", "Territorial development", "Public policy", "History of economic thought"]
  es: ["Economía de la cultura", "Economía del turismo", "Desarrollo territorial", "Políticas públicas", "Historia del pensamiento económico"]

