# Fotos de paisaje en la cabecera de las páginas internas.
#
# Guarda la foto (horizontal, unos 2000 px de ancho, JPG) en public/img/banners/
# y escribe su nombre en `image`. Si `image` está vacío, la página no muestra foto.
#
# alt:     descripción breve de la foto, para lectores de pantalla.
# place:   lugar de la foto (se muestra con un ícono de ubicación).
# credit:  autor y licencia, si la foto no es tuya.
# caption: alternativa simple: un único pie de foto.
# focus:   qué parte de la foto conservar al recortarla: "center", "top", "bottom", "50% 30%"…
# image también puede ser una dirección https:// completa.

research:
  image: ""
  alt: { en: "", es: "" }
  caption: { en: "", es: "" }
  focus: "center"

projects:
  image: "https://live.staticflickr.com/65535/50401809342_f1272378b0_b.jpg"
  alt: { en: "Giant bench of the Big Bench Community Project on the Colli di San Fermo, Lombardy", es: "Banca gigante del Big Bench Community Project en los Colli di San Fermo, Lombardía" }
  place: { en: "Big Bench Community Project · Colli di San Fermo, Bergamo (Italy)", es: "Big Bench Community Project · Colli di San Fermo, Bérgamo (Italia)" }
  credit: { en: "Photo: [alfp_photo](https://www.flickr.com/photos/freemanphoto/50401809342/) · CC BY-NC-ND 2.0", es: "Foto: [alfp_photo](https://www.flickr.com/photos/freemanphoto/50401809342/) · CC BY-NC-ND 2.0" }
  # full: muestra la foto completa, sin recortar (necesario con licencias "ND", que no permiten modificarla).
  full: true

