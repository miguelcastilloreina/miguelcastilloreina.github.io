intro:
  en: "Economist and PhD candidate in Regional Science and Economic Geography at GSSI, with several years of experience in research, teaching, consulting and the design of science, technology and innovation (STI) policy in Colombian regions. Recognized as Junior Researcher by Colombia's Ministry of Science, Technology and Innovation."
  es: "Economista y doctorando en Ciencia Regional y Geografía Económica en el GSSI, con varios años de experiencia en investigación, docencia, consultoría y diseño de políticas de ciencia, tecnología e innovación (CTeI) en las regiones de Colombia. Reconocido como Investigador Junior por el Ministerio de Ciencia, Tecnología e Innovación."

